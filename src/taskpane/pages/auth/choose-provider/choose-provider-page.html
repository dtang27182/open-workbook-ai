<section class="auth-view" id="choose-provider-page">
    <img class="auth-mark" src="/assets/icon-32.png" alt="" width="32" height="32" />
    <h2>Choose an AI provider</h2>
    <p class="auth-description">Sign in with a provider so this add-in can use models through your own account. Your key is stored on this device only.</p>
    <div class="provider-list">
        <button id="choose-openrouter" class="provider-card" type="button">
            <span class="provider-mark" aria-hidden="true">OR</span>
            <span class="provider-card-copy"><strong>OpenRouter</strong><span>Sign in · many model families</span></span>
            <span class="provider-card-arrow" aria-hidden="true">›</span>
        </button>
        <button id="choose-openai" class="provider-card" type="button">
            <span class="provider-mark" aria-hidden="true">OA</span>
            <span class="provider-card-copy"><strong>OpenAI</strong><span>API key · GPT models</span></span>
            <span class="provider-card-arrow" aria-hidden="true">›</span>
        </button>
    </div>
    <div class="auth-disclosure">Requests send the active worksheet's used range and your message to the provider you choose. Don't use workbooks you aren't permitted to share.</div>
    <footer class="auth-footer">Prerelease</footer>
</section>
