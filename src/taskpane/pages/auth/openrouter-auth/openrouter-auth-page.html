<button id="openrouter-all-providers" class="auth-back" type="button"><span aria-hidden="true">‹</span> All providers</button>
<span class="provider-mark api-key-mark" aria-hidden="true">OR</span>
<h2>Connect OpenRouter</h2>
<p class="auth-description">Either way, your key is stored on this device only and sent only to OpenRouter.</p>
<div class="provider-list">
    <button id="openrouter-sign-in" class="provider-card" type="button">
        <span class="provider-card-copy"><strong>Sign in with OpenRouter</strong><span>Opens a sign-in window. A key is created for you.</span></span>
        <span class="provider-card-arrow" aria-hidden="true">›</span>
    </button>
    <button id="openrouter-use-key" class="provider-card" type="button">
        <span class="provider-card-copy"><strong>Use an API key</strong><span>Paste a key you already have. Useful if pop-ups are blocked.</span></span>
        <span class="provider-card-arrow" aria-hidden="true">›</span>
    </button>
</div>
<p id="openrouter-auth-error" class="auth-error" role="alert" hidden></p>
<p id="openrouter-auth-status" class="auth-note" role="status" hidden></p>
<footer class="auth-footer">Usage is billed to your OpenRouter account.</footer>
