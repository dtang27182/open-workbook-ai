<div class="chat-heading">
    <h2 class="ms-font-l">Open Workbook AI</h2>
    <div class="chat-actions">
        <button id="openrouter-sign-out" class="btn btn-secondary btn-compact" type="button">Sign Out</button>
        <button id="chat-clear" class="btn btn-secondary btn-compact" type="button">Clear</button>
    </div>
</div>
<div class="provider-link-details">
    <span>OpenRouter linked</span>
    <a id="openrouter-manage-key" target="_blank" rel="noopener noreferrer" hidden>Manage OpenRouter key</a>
</div>
<div id="chat-messages" class="chat-messages" aria-live="polite"></div>
<form id="chat-form" class="chat-form">
    <label class="visually-hidden" for="chat-input">Ask Open Workbook AI</label>
    <textarea id="chat-input" rows="1" placeholder="Ask about the active worksheet" autocomplete="off"></textarea>
    <button id="chat-send" class="btn btn-send" type="submit">Send</button>
</form>
